<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — GREENBITE</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Prompt:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--cream:#F7F0DF;--light:#FFF9EC;--green:#163C2A;--lime:#C9E86A;--orange:#F28C45;--black:#171713}
*{box-sizing:border-box;margin:0;padding:0}body{background:var(--cream);color:var(--black);font-family:Prompt,sans-serif}a{color:inherit;text-decoration:none}
.nav{width:92%;max-width:1180px;margin:20px auto;padding:13px 18px;border:3px solid;background:var(--light);box-shadow:5px 5px #171713;display:flex;justify-content:space-between;align-items:center}.logo{font-size:25px;font-weight:800}.logo span{color:var(--orange)}.nav-links{display:flex;gap:25px;font-size:14px;font-weight:600}.menu{display:none}
main{width:92%;max-width:1180px;margin:90px auto 120px;display:grid;grid-template-columns:1fr 1fr;gap:70px;align-items:start}
h1{font-size:clamp(60px,8vw,105px);line-height:.84;letter-spacing:-5px}h1 span{color:var(--orange)}
.intro{font-family:"DM Sans";font-size:18px;line-height:1.7;margin-top:30px;max-width:450px}
.info{margin-top:45px;border-top:3px solid;padding-top:25px}.info p{margin:12px 0;font-family:"DM Sans";font-size:17px}
.form{background:var(--light);border:3px solid;padding:35px;box-shadow:8px 8px #171713}
label{display:block;font-weight:700;margin:0 0 7px}input,textarea{width:100%;border:3px solid;background:var(--cream);padding:14px;font:inherit;margin-bottom:20px;outline:none}input:focus,textarea:focus{border-color:var(--orange)}textarea{height:140px;resize:vertical}
button{width:100%;background:var(--green);color:white;border:3px solid;padding:15px;font:700 16px Prompt;box-shadow:5px 5px #171713;cursor:pointer;transition:.2s}button:hover{transform:translate(4px,4px);box-shadow:1px 1px #171713}
footer{background:var(--green);color:var(--cream);padding:55px 4%}footer span{color:var(--lime)}
@media(max-width:700px){.nav-links{display:none}.menu{display:block}main{grid-template-columns:1fr;margin-top:60px;gap:50px}}
</style>
</head>
<body>
<nav class="nav"><a class="logo" href="index.html">GREEN<span>BITE</span></a><div class="nav-links"><a href="index.html">Home</a><a href="services.html">Services</a><a href="work.html">Our Food</a><a href="process.html">Process</a><a href="contact.html">Contact</a></div><div class="menu">☰</div></nav>

<main>
<section>
<h1>Let's make<br>your day<br><span>healthier.</span></h1>
<p class="intro">อยากสั่งอาหาร สอบถามเมนู หรือคุยเรื่องบริการสำหรับองค์กร? ส่งข้อความหาเราได้เลย</p>
<div class="info">
<p><strong>📍</strong> Bangkok, Thailand</p>
<p><strong>✉</strong> hello@greenbite.example</p>
<p><strong>☎</strong> 02-000-0000</p>
</div>
</section>

<form class="form" onsubmit="sendMessage(event)">
<label>ชื่อ</label>
<input type="text" placeholder="ชื่อของคุณ" required>
<label>อีเมล</label>
<input type="email" placeholder="you@example.com" required>
<label>ข้อความ</label>
<textarea placeholder="อยากคุยกับเราเรื่องอะไร?" required></textarea>
<button type="submit">ส่งข้อความ →</button>
</form>
</main>

<footer><h2>GREEN<span>BITE</span> — Eat better. Feel better.</h2></footer>

<script>
function sendMessage(e){
 e.preventDefault();
 alert("ขอบคุณสำหรับข้อความ! ทีม GREENBITE จะติดต่อกลับโดยเร็วที่สุด");
 e.target.reset();
}
</script>
</body>
</html>
